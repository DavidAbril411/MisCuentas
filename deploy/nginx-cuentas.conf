# /etc/nginx/sites-available/cuentas.abrilcodes.com
# Reverse proxy de https://cuentas.abrilcodes.com hacia el contenedor
# miscuentas que escucha en 127.0.0.1:5001 (gunicorn).
# Reusa el TLS config del audit de Cappy (options-ssl-nginx.conf, ssl-dhparams.pem).

server {
    listen 80;
    listen [::]:80;
    server_name cuentas.abrilcodes.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cuentas.abrilcodes.com;

    ssl_certificate     /etc/letsencrypt/live/cuentas.abrilcodes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuentas.abrilcodes.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Cappy ya consolida los suyos en helmet; acá los
    # ponemos a mano porque miscuentas no usa helmet).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/cuentas.access.log;
    error_log  /var/log/nginx/cuentas.error.log warn;
}
