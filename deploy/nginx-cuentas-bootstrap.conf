# /srv/nginx/conf.d/cuentas.abrilcodes.com.conf  (BOOTSTRAP, sólo HTTP-80)
#
# Uso una sola vez: antes de que existan los certs de Let's Encrypt, para que
# nginx levante sin fallar nginx -t y certbot --webroot pueda escribir el
# challenge en /var/www/letsencrypt.
#
# Después de emitir el cert con:
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d cuentas.abrilcodes.com
# pisás este archivo con deploy/nginx-cuentas.conf (el full, con HTTPS) y
# reload de nginx.

server {
    listen 80;
    listen [::]:80;
    server_name cuentas.abrilcodes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 200 "miscuentas bootstrap — cert pending\n";
        add_header Content-Type text/plain;
    }
}
