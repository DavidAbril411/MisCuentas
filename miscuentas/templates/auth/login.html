{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Iniciar sesión</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input class="form-control" name="username" required autofocus value="{{ username }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="mt-3 small">¿No tenés cuenta? <a href="{{ url_for('auth.register') }}">Registrate</a></p>
  </div>
</div>
{% endblock %}
