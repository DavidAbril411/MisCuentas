{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Crear cuenta</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input class="form-control" name="username" required autofocus value="{{ username }}"
               pattern="[A-Za-z0-9_.\-]{3,30}" minlength="3" maxlength="30">
        <div class="form-text">3-30 caracteres, letras/números/._-</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" type="password" name="password" required minlength="8">
        <div class="form-text">Mínimo 8 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input class="form-control" type="password" name="confirm" required minlength="8">
      </div>
      <button class="btn btn-primary w-100">Registrarme</button>
    </form>
    <p class="mt-3 small">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a></p>
  </div>
</div>
{% endblock %}
