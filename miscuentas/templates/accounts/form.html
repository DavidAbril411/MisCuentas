{% extends "base.html" %}
{% block content %}
<h2>{{ 'Editar' if account else 'Nueva' }} cuenta</h2>
<form method="post" class="row g-3" style="max-width: 600px;">
  <div class="col-12">
    <label class="form-label">Nombre</label>
    <input class="form-control" name="name" required value="{{ account.name if account else '' }}">
  </div>
  <div class="col-md-6 form-check ms-2">
    <input class="form-check-input" type="checkbox" name="is_credit_card" id="is_credit_card" {% if account and account.is_credit_card %}checked{% endif %}>
    <label class="form-check-label" for="is_credit_card">Es Tarjeta de Crédito</label>
  </div>
  {% if not account %}
  <div class="col-md-6">
    <label class="form-label">Moneda</label>
    <select class="form-select" name="currency" required>
      <option value="ARS">ARS</option>
      <option value="USD">USD</option>
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Saldo inicial</label>
    <input class="form-control" name="opening_balance" value="0" type="number" step="0.01" min="0">
  </div>
  <div class="col-md-6">
    <label class="form-label">FX inicial (sólo USD)</label>
    <input class="form-control" name="opening_fx" type="number" step="0.0001" min="0">
  </div>
  {% else %}
  <div class="col-md-6 form-check ms-2">
    <input class="form-check-input" type="checkbox" name="archived" id="archived" {% if account.archived %}checked{% endif %}>
    <label class="form-check-label" for="archived">Archivada</label>
  </div>
  {% endif %}
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-link" href="{{ url_for('accounts.list_accounts') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
