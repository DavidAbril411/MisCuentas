<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MisCuentas{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { padding-bottom: 3rem; }
    .money-pos { color: #198754; }
    .money-neg { color: #dc3545; }
    .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .badge-usd { background: #0d6efd; }
    .badge-ars { background: #6c757d; }
    .small-muted { color: #6c757d; font-size: 0.85rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard.index') }}">MisCuentas</a>
    <div>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('accounts.list_accounts') }}">Cuentas</a>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('transactions.list_tx') }}">Movimientos</a>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('recurring.list_rules') }}">Recurrentes</a>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('debts.list_debts') }}">Deudas</a>
      <a class="nav-link d-inline-block text-light" href="{{ url_for('fx.list_rates') }}">Cotización</a>
    </div>
  </div>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
