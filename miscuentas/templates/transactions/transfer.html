{% extends "base.html" %}
{% block title %}Nueva Transferencia · MisCuentas{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card shadow border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-gradient bg-primary py-3">
          <h3 class="card-title text-white mb-0 fs-4">Registrar Transferencia / Pago de Tarjeta</h3>
        </div>
        <div class="card-body p-4">
          <form method="post" class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Fecha</label>
              <input class="form-control" type="date" name="occurred_on" required value="{{ today.isoformat() }}">
            </div>
            
            <div class="col-md-6">
              <label class="form-label fw-semibold">Monto</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input class="form-control" type="number" step="0.01" min="0.01" name="amount" required placeholder="0.00">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Cuenta Origen (Desde)</label>
              <select class="form-select" name="source_account_id" required>
                {% for a in accounts %}
                  <option value="{{ a.id }}">{{ a.name }} ({{ a.currency }})</option>
                {% endfor %}
              </select>
              <div class="form-text">La cuenta de donde sale el dinero.</div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Cuenta Destino (Hacia / Tarjeta)</label>
              <select class="form-select" name="dest_account_id" required>
                {% for a in accounts %}
                  <option value="{{ a.id }}">{{ a.name }} ({{ a.currency }})</option>
                {% endfor %}
              </select>
              <div class="form-text">La cuenta donde se recibe el dinero o la tarjeta que se paga.</div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Descripción (Opcional)</label>
              <input class="form-control" name="description" placeholder="Ej: Pago Tarjeta Naranja">
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 pt-3 border-top">
              <a class="btn btn-light px-4" href="{{ url_for('transactions.list_tx') }}">Cancelar</a>
              <button class="btn btn-primary px-4">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
