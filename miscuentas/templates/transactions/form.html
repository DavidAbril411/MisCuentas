{% extends "base.html" %}
{% block content %}
<h2>{{ 'Editar' if tx else 'Nuevo' }} movimiento</h2>
<form method="post" class="row g-3" style="max-width: 720px;">
  <div class="col-md-4">
    <label class="form-label">Fecha</label>
    <input class="form-control" type="date" name="occurred_on" required
           value="{{ (tx.occurred_on if tx else today).isoformat() }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Tipo</label>
    <select class="form-select" name="kind">
      <option value="expense" {% if tx and tx.kind=='expense' %}selected{% endif %}>Gasto</option>
      <option value="income" {% if tx and tx.kind=='income' %}selected{% endif %}>Ingreso</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Cuenta</label>
    <select class="form-select" name="account_id" required>
      {% for a in accounts %}
        <option value="{{ a.id }}" {% if tx and tx.account_id==a.id %}selected{% endif %}>{{ a.name }} ({{ a.currency }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Moneda</label>
    <select class="form-select" name="currency" id="currency">
      <option value="ARS" {% if tx and tx.currency=='ARS' %}selected{% endif %}>ARS</option>
      <option value="USD" {% if tx and tx.currency=='USD' %}selected{% endif %}>USD</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Monto</label>
    <input class="form-control" type="number" step="0.01" min="0.01" name="amount" required
           value="{{ (tx.amount_minor | decimal) if tx else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">FX (sólo USD)</label>
    <input class="form-control" type="number" step="0.0001" min="0" name="fx_rate" id="fx_rate"
           value="{{ current_rate if current_rate else '' }}">
    <div class="form-text">Por defecto usa la cotización vigente ({{ current_rate or '—' }}).</div>
  </div>
  <div class="col-md-8">
    <label class="form-label">Categoría</label>
    <select class="form-select" name="category_id">
      <option value="">— (sin categoría)</option>
      {% for c in categories %}
        <option value="{{ c.id }}" {% if tx and tx.category_id==c.id %}selected{% endif %}>{{ c.name }} ({{ c.kind }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12">
    <label class="form-label">Descripción</label>
    <input class="form-control" name="description" value="{{ tx.description if tx else '' }}">
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-link" href="{{ url_for('transactions.list_tx') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
